<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Error: something went wrong" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <path id="spark" d="M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 Z"/>
  </defs>

  <!-- card -->
  <rect width="480" height="400" rx="24" fill="#1a1625"/>
  <rect x="2" y="2" width="476" height="396" rx="22" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <ellipse cx="240" cy="190" rx="200" ry="150" fill="url(#glow)"/>

  <!-- ERROR tag -->
  <rect x="24" y="24" width="90" height="28" rx="14" fill="#fbbf24"/>
  <text x="69" y="43" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="2" fill="#1a1625">ERROR</text>

  <!-- sparkles -->
  <use href="#spark" transform="translate(70,110)" fill="#fbbf24"/>
  <use href="#spark" transform="translate(420,100) scale(0.8)" fill="#f5f3ff"/>
  <use href="#spark" transform="translate(405,255) scale(0.6)" fill="#fbbf24"/>
  <use href="#spark" transform="translate(65,250) scale(0.7)" fill="#f5f3ff"/>

  <!-- shadow -->
  <ellipse cx="240" cy="296" rx="95" ry="10" fill="#0d0b14" opacity="0.6"/>

  <!-- controller character -->
  <g transform="translate(240,205)">
    <!-- broken cable -->
    <path d="M0,-66 C0,-84 -14,-92 -14,-108" fill="none" stroke="#f5f3ff" stroke-width="6" stroke-linecap="round"/>
    <polygon points="10,-112 2,-98 10,-98 4,-84 18,-102 10,-102" fill="#fbbf24"/>
    <g transform="translate(50,-124) rotate(25)">
      <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#f5f3ff"/>
      <rect x="-6" y="-14" width="4" height="7" fill="#f5f3ff"/>
      <rect x="2" y="-14" width="4" height="7" fill="#f5f3ff"/>
      <path d="M10,0 C24,6 28,-10 40,-4" fill="none" stroke="#f5f3ff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <path d="M-96,-28 C-96,-58 -66,-66 -38,-66 L38,-66 C66,-66 96,-58 96,-28 C102,14 114,62 90,78 C70,90 48,72 38,50 L-38,50 C-48,72 -70,90 -90,78 C-114,62 -102,14 -96,-28 Z"
          fill="url(#body)" stroke="#0d0b14" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-70,-52 C-40,-60 40,-60 70,-52" fill="none" stroke="#f5f3ff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>

    <!-- d-pad and buttons -->
    <rect x="-74" y="21" width="24" height="8" rx="2" fill="#0d0b14"/>
    <rect x="-66" y="13" width="8" height="24" rx="2" fill="#0d0b14"/>
    <circle cx="62" cy="14" r="7" fill="#fbbf24"/>
    <circle cx="80" cy="30" r="7" fill="#f5f3ff"/>

    <!-- face: x_x -->
    <path d="M-36,-36 L-18,-18 M-18,-36 L-36,-18 M18,-36 L36,-18 M36,-36 L18,-18" fill="none" stroke="#f5f3ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-16,6 Q0,-8 16,6" fill="none" stroke="#f5f3ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-52" cy="-2" r="8" fill="#fbbf24" opacity="0.45"/>
    <circle cx="52" cy="-2" r="8" fill="#fbbf24" opacity="0.45"/>
    <path d="M70,-54 C64,-42 62,-36 70,-32 C78,-36 76,-42 70,-54 Z" fill="#f5f3ff" opacity="0.8"/>
  </g>

  <!-- text -->
  <text x="240" y="338" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#f5f3ff">Oops! Something went wrong</text>
  <text x="240" y="366" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="15" fill="#f5f3ff" opacity="0.7">Please try again in a moment.</text>
</svg>
